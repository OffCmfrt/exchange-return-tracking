<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manufacture Studio — Admin Review</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000000;
  --surface: #0a0a0a;
  --surface-2: #121212;
  --border: #1f1f1f;
  --border-hover: #3a3a3a;
  --text: #ffffff;
  --muted: #666666;
  --faint: #9a9a9a;
  --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}

body, html {
  background: var(--bg); color: var(--text);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.hidden { display: none !important; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Login ── */
.login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; position: relative; overflow: hidden; }
.login::before { content: ""; position: absolute; inset: 0; background: radial-gradient(600px circle at 50% 20%, rgba(255,255,255,0.06), transparent 60%); pointer-events: none; }
.login-card { width: 100%; max-width: 420px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 3rem 2.5rem; animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) both; }
.wordmark {
  text-align: center; font-size: 1.6rem; font-weight: 800; letter-spacing: 0.45em; text-indent: 0.45em; margin-bottom: 0.5rem;
  background: linear-gradient(90deg, #ffffff 0%, #8a8a8a 40%, #ffffff 60%, #ffffff 100%);
  background-size: 400px 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  animation: shimmer 4s linear infinite;
}
.kicker { text-align: center; font-size: 0.65rem; letter-spacing: 0.35em; text-indent: 0.35em; text-transform: uppercase; color: var(--muted); margin-bottom: 2.25rem; }

.label { display: block; font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--faint); margin-bottom: 0.5rem; }
.input, .textarea, .select {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px;
  color: var(--text); padding: 0.8rem 1rem; font-size: 0.9rem; font-family: inherit; outline: none;
  transition: border-color var(--transition), box-shadow var(--transition);
}
.input:focus, .textarea:focus, .select:focus { border-color: var(--border-hover); box-shadow: 0 0 0 3px rgba(255,255,255,0.05); }
.textarea { resize: vertical; min-height: 60px; }
.btn {
  padding: 0.85rem 1.25rem; border-radius: 10px; border: none; background: #fff; color: #000;
  font-weight: 700; font-size: 0.8rem; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer;
  transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
  font-family: inherit; width: 100%;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,255,255,0.12); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
.btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); width: auto; padding: 0.55rem 1.1rem; }
.btn-ghost:hover { border-color: var(--border-hover); box-shadow: none; }
.error-msg { margin-top: 1rem; font-size: 0.8rem; color: #ff6b6b; text-align: center; animation: fadeIn 0.3s ease; }
.spinner { width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.2); border-top-color: #000; border-radius: 50%; display: inline-block; animation: spin 0.7s linear infinite; vertical-align: -3px; margin-left: 0.5rem; }

/* ── App shell ── */
.app { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
.topbar h1 { font-size: 1.15rem; font-weight: 800; letter-spacing: 0.35em; text-transform: uppercase; }
.topbar .sub { font-size: 0.62rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--muted); margin-top: 0.3rem; }
.topbar-actions { display: flex; gap: 0.75rem; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.stat {
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 1.4rem 1.5rem; position: relative; overflow: hidden;
  transition: transform var(--transition), border-color var(--transition);
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both;
}
.stat:hover { transform: translateY(-3px); border-color: var(--border-hover); }
.stat::after { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent); }
.stat-label { font-size: 0.6rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.6rem; }
.stat-value { font-size: 2rem; font-weight: 800; letter-spacing: -0.02em; }

/* Filter tabs */
.tabs { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
.tab {
  background: transparent; border: 1px solid var(--border); color: var(--faint);
  border-radius: 100px; padding: 0.5rem 1.15rem; font-size: 0.65rem; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer; font-family: inherit; transition: all var(--transition);
}
.tab:hover { border-color: var(--border-hover); color: var(--text); }
.tab.active { background: #fff; color: #000; border-color: #fff; }

/* Table */
.table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; font-size: 0.58rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted);
  padding: 1rem 1.25rem; border-bottom: 1px solid var(--border); background: var(--surface-2);
}
td { padding: 1.1rem 1.25rem; border-bottom: 1px solid var(--border); font-size: 0.85rem; vertical-align: top; }
tr:last-child td { border-bottom: none; }
tr { animation: fadeIn 0.4s ease both; transition: background var(--transition); }
tbody tr:hover { background: rgba(255,255,255,0.02); }
.d-name { font-weight: 700; font-size: 0.9rem; }
.d-style { font-size: 0.6rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-top: 0.25rem; }
.d-desc { font-size: 0.78rem; color: var(--faint); margin-top: 0.5rem; line-height: 1.55; max-width: 320px; white-space: pre-wrap; }
.d-date { color: var(--faint); font-size: 0.78rem; white-space: nowrap; }

.badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-size: 0.58rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 0.35rem 0.75rem; border-radius: 100px; border: 1px solid var(--border);
  color: var(--faint); background: var(--surface-2); white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.pending { color: #d4d4d4; }
.badge.approved { color: #ffffff; background: rgba(255,255,255,0.1); }
.badge.in_production { color: #bdbdbd; }
.badge.in_production::before { animation: pulse 1.6s ease infinite; }
.badge.completed { color: #8f8f8f; }
.badge.rejected { color: #7a7a7a; }

.overdue { color: #ff6b6b; animation: pulse 2s ease infinite; }

.status-cell { min-width: 190px; }
.status-cell .select { padding: 0.5rem 0.7rem; font-size: 0.78rem; margin-bottom: 0.5rem; }
.status-cell .textarea { font-size: 0.75rem; padding: 0.5rem 0.7rem; min-height: 44px; margin-bottom: 0.5rem; }
.save-btn {
  background: #fff; color: #000; border: none; border-radius: 8px; padding: 0.45rem 1rem;
  font-size: 0.6rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; font-family: inherit; transition: all var(--transition); width: 100%;
}
.save-btn:hover { box-shadow: 0 4px 16px rgba(255,255,255,0.15); }
.save-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.empty { text-align: center; padding: 4rem 1rem; color: var(--muted); font-size: 0.85rem; letter-spacing: 0.05em; animation: fadeIn 0.5s ease both; }

.toast {
  position: fixed; bottom: 2rem; left: 50%; transform: translateX(-50%);
  background: #ffffff; color: #000; padding: 0.8rem 1.5rem; border-radius: 100px;
  font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  box-shadow: 0 10px 40px rgba(255,255,255,0.15); z-index: 200; animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1);
}
.toast.error { background: #1a1a1a; color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }

@media (max-width: 900px) {
  .table-wrap { overflow-x: auto; }
  table { min-width: 900px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginSection" class="login">
  <div class="login-card">
    <div class="wordmark">OFFCOMFRT</div>
    <div class="kicker">Manufacture Studio — Admin</div>
    <form id="loginForm">
      <div style="margin-bottom:1.25rem;">
        <label class="label" for="adminPassword">Admin Password</label>
        <input class="input" type="password" id="adminPassword" autocomplete="current-password" required>
      </div>
      <button class="btn" type="submit" id="loginBtn">Review Designs</button>
      <div id="loginErr" class="error-msg hidden"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="appSection" class="app hidden">
  <div class="topbar">
    <div>
      <h1>Design Review</h1>
      <div class="sub">OFFCOMFRT — Manufacture Studio · Admin</div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost" onclick="loadDesigns()">Refresh</button>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <div class="table-wrap">
    <div id="tableContainer"></div>
  </div>
</div>

<script>
(function () {
  const API = ''; // same-origin (served from the returns server)
  let authToken = null; // JWT kept in memory only
  let designs = [];
  let activeFilter = 'all';

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  const STATUS_LABELS = { pending: 'Pending Review', approved: 'Approved', in_production: 'In Production', completed: 'Completed', rejected: 'Rejected' };
  const STATUSES = ['pending', 'approved', 'in_production', 'completed', 'rejected'];

  function api(path, options = {}) {
    return fetch(API + path, {
      ...options,
      headers: { 'Content-Type': 'application/json', ...(authToken ? { Authorization: 'Bearer ' + authToken } : {}), ...(options.headers || {}) }
    });
  }

  function toast(msg, isError) {
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.4s'; setTimeout(() => el.remove(), 400); }, 2600);
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  function deadlineCell(iso) {
    const d = new Date(iso);
    if (isNaN(d)) return '<span class="d-date">—</span>';
    const days = Math.ceil((d - new Date()) / 86400000);
    let label = fmtDate(iso);
    if (days < 0) return '<span class="d-date overdue">' + esc(label) + ' · overdue ' + Math.abs(days) + 'd</span>';
    if (days === 0) return '<span class="d-date" style="color:#fff;">' + esc(label) + ' · today</span>';
    if (days <= 7) return '<span class="d-date" style="color:#fff;">' + esc(label) + ' · ' + days + 'd</span>';
    return '<span class="d-date">' + esc(label) + '</span>';
  }

  function countUp(el, target) {
    const dur = 700, start = performance.now();
    function tick(now) {
      const p = Math.min((now - start) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ── Auth ──
  window.logout = function () {
    authToken = null; designs = [];
    $('appSection').classList.add('hidden');
    $('loginSection').classList.remove('hidden');
    $('adminPassword').value = '';
  };

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = $('loginBtn'), err = $('loginErr');
    const password = $('adminPassword').value.trim();
    if (!password) return;
    btn.disabled = true; btn.innerHTML = 'Verifying<span class="spinner"></span>';
    err.classList.add('hidden');
    try {
      const res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
      const data = await res.json();
      if (res.ok && data.token) {
        authToken = data.token;
        $('loginSection').classList.add('hidden');
        $('appSection').classList.remove('hidden');
        await loadDesigns();
      } else {
        err.textContent = data.error || 'Invalid password';
        err.classList.remove('hidden');
      }
    } catch (e2) {
      err.textContent = 'Connection error. Try again.';
      err.classList.remove('hidden');
    }
    btn.disabled = false; btn.textContent = 'Review Designs';
  });

  // ── Data ──
  window.loadDesigns = async function () {
    try {
      const res = await api('/api/manufacture/admin/designs');
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      designs = data.designs || [];
      renderStats();
      renderTabs();
      renderTable();
    } catch (e) {
      toast('Failed to load designs', true);
    }
  };

  function renderStats() {
    const count = (s) => designs.filter((d) => d.status === s).length;
    const items = [
      { label: 'Total', value: designs.length },
      { label: 'Pending', value: count('pending') },
      { label: 'Approved', value: count('approved') },
      { label: 'In Production', value: count('in_production') },
      { label: 'Completed', value: count('completed') }
    ];
    $('stats').innerHTML = items.map((s, i) =>
      '<div class="stat" style="animation-delay:' + (i * 0.06) + 's">' +
        '<div class="stat-label">' + esc(s.label) + '</div>' +
        '<div class="stat-value" data-v="' + s.value + '">0</div>' +
      '</div>'
    ).join('');
    document.querySelectorAll('#stats .stat-value').forEach((el) => countUp(el, parseInt(el.getAttribute('data-v'), 10) || 0));
  }

  function renderTabs() {
    const filters = ['all'].concat(STATUSES);
    $('tabs').innerHTML = filters.map((f) => {
      const n = f === 'all' ? designs.length : designs.filter((d) => d.status === f).length;
      return '<button class="tab' + (activeFilter === f ? ' active' : '') + '" onclick="setFilter(\'' + f + '\')">' + (f === 'all' ? 'All' : STATUS_LABELS[f]) + ' · ' + n + '</button>';
    }).join('');
  }

  window.setFilter = function (f) { activeFilter = f; renderTabs(); renderTable(); };

  function renderTable() {
    const list = activeFilter === 'all' ? designs : designs.filter((d) => d.status === activeFilter);
    if (!list.length) {
      $('tableContainer').innerHTML = '<div class="empty">No designs ' + (activeFilter === 'all' ? 'submitted yet' : 'with status "' + STATUS_LABELS[activeFilter] + '"') + '.</div>';
      return;
    }
    $('tableContainer').innerHTML =
      '<table><thead><tr>' +
        '<th>Design</th><th>Qty</th><th>Deadline</th><th>Submitted</th><th>Status</th><th>Update</th>' +
      '</tr></thead><tbody>' +
      list.map((d, i) =>
        '<tr style="animation-delay:' + Math.min(i * 0.04, 0.4) + 's">' +
          '<td>' +
            '<div class="d-name">' + esc(d.design_name) + '</div>' +
            (d.style_code ? '<div class="d-style">' + esc(d.style_code) + '</div>' : '') +
            (d.description ? '<div class="d-desc">' + esc(d.description) + '</div>' : '') +
          '</td>' +
          '<td style="white-space:nowrap;font-weight:600;">' + Number(d.quantity).toLocaleString('en-IN') + '</td>' +
          '<td>' + deadlineCell(d.deadline) + '</td>' +
          '<td class="d-date">' + fmtDate(d.created_at) + '</td>' +
          '<td><span class="badge ' + esc(d.status) + '">' + esc(STATUS_LABELS[d.status] || d.status) + '</span></td>' +
          '<td class="status-cell">' +
            '<select class="select" id="st-' + d.id + '">' +
              STATUSES.map((s) => '<option value="' + s + '"' + (d.status === s ? ' selected' : '') + '>' + STATUS_LABELS[s] + '</option>').join('') +
            '</select>' +
            '<textarea class="textarea" id="nt-' + d.id + '" placeholder="Admin note (optional)">' + esc(d.admin_note || '') + '</textarea>' +
            '<button class="save-btn" id="sb-' + d.id + '" onclick="saveStatus(\'' + d.id + '\')">Save</button>' +
          '</td>' +
        '</tr>'
      ).join('') +
      '</tbody></table>';
  }

  window.saveStatus = async function (id) {
    const btn = $('sb-' + id);
    const status = $('st-' + id).value;
    const admin_note = $('nt-' + id).value.trim();
    btn.disabled = true; btn.innerHTML = 'Saving<span class="spinner"></span>';
    try {
      const res = await api('/api/manufacture/admin/designs/' + id + '/status', { method: 'PUT', body: JSON.stringify({ status, admin_note }) });
      if (res.status === 401) { logout(); return; }
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Update failed');
      toast('Status updated');
      await loadDesigns();
    } catch (e) {
      toast(e.message || 'Update failed', true);
      btn.disabled = false; btn.textContent = 'Save';
    }
  };
})();
</script>
</body>
</html>
